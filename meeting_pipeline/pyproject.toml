[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meeting-pipeline"
version = "0.1.0"
description = "Temporal multimodal meeting processing pipeline: transcribe, extract slide/screen frames, build topic-level context, and align meeting topics with reference documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24",
    "webvtt-py>=0.4.6",
    "sentence-transformers>=2.2.2",
    "yake>=0.4.8",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime>=1.3.0"]
easyocr = ["easyocr>=1.7.0"]
paddleocr = ["paddleocr>=2.7.0", "paddlepaddle>=2.5.0"]
tesseract = ["pytesseract>=0.3.10"]
ocr = ["meeting-pipeline[rapidocr]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.scripts]
meeting-pipeline = "meeting_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --strict-markers"
markers = [
    "slow: needs model downloads or a real video",
    "integration: exercises more than one pipeline stage together",
    "requires_ocr: needs an OCR backend installed",
    "requires_ffmpeg: needs the ffmpeg CLI on PATH",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
ignore_missing_imports = true
